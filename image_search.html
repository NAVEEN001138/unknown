<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Image Search</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- Google Fonts for Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: all 0.3s ease-in-out;
            background-color: #f8f9fa; /* Light background for a clean look */
        }
        .header-nav .nav-link {
            color: #1a73e8; /* Google Blue for links */
            text-decoration: none;
            transition: color 0.2s ease-in-out;
        }
        .header-nav .nav-link:hover {
            color: #0056b3; /* Darker blue on hover */
            text-decoration: underline;
        }
        .form-control-search {
            border-radius: 24px; /* More rounded corners for search bar */
            height: 48px; /* Taller search bar */
            padding-left: 20px;
            padding-right: 20px;
            font-size: 1.1rem;
            border: 1px solid #dadce0;
            box-shadow: none; /* Remove default Bootstrap shadow */
            transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .form-control-search:focus {
            border-color: transparent;
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
        }
        .btn-image-search {
            background-color: #4285f4; /* Google Blue */
            border-color: #4285f4;
            color: white;
            font-weight: 500;
            padding: 8px 15px;
            border-radius: 4px;
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .btn-image-search:hover {
            background-color: #357ae8; /* Darker Google Blue on hover */
            border-color: #357ae8;
            box-shadow: 0 1px 3px rgba(0,0,0,.2);
        }
        .google-image-title {
            font-size: 2.25rem; /* text-4xl equivalent */
            font-weight: 300; /* font-light equivalent */
            color: #5f6368; /* Darker gray for the "Images" part */
        }
        .google-image-title .google-blue { color: #4285f4; }
        .google-image-title .google-red { color: #ea4335; }
        .google-image-title .google-yellow { color: #fbbc05; }
        .google-image-title .google-green { color: #34a853; }
    </style>
</head>
<body class="bg-white text-gray-800">
    <!-- Header: Contains navigation link back to the main search page -->
    <header class="d-flex justify-content-end p-3 bg-light">
        <nav class="header-nav">
            <a href="index.html" class="nav-link">Google Search</a>
        </nav>
    </header>

    <!-- Main Content Area: Centered image search logo, search bar, and button -->
    <main class="flex-grow-1 d-flex flex-column justify-content-center align-items-center p-4">
        <!-- Google Image Search Title/Logo -->
        <div class="mb-4 google-image-title">
            <span class="google-blue">G</span><span class="google-red">o</span><span class="google-yellow">o</span><span class="google-blue">g</span><span class="google-green">l</span><span class="google-red">e</span>
            <span class="fw-normal text-secondary">Images</span>
        </div>

        <!-- Image Search Form -->
        <form action="https://www.google.com/search" method="GET" class="d-flex flex-column align-items-center w-100" style="max-width: 580px;">
            <!-- Hidden input to specify image search -->
            <input type="hidden" name="tbm" value="isch">
            <!-- Image Search Input Field -->
            <input type="text" name="q" class="form-control form-control-search mb-4" placeholder="Search for images">

            <!-- Image Search Button -->
            <div>
                <button type="submit" class="btn btn-image-search">Image Search</button>
            </div>
        </form>
    </main>

    <!-- Optional Footer -->
    <footer class="p-3 text-center text-muted small mt-auto bg-light">
        &copy; 2025 Google Reimagined
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigF/h/6tC/vT/t6l5V" crossorigin="anonymous"></script>
</body>
</html>
