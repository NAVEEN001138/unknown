<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Advanced Search</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- Google Fonts for Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: all 0.3s ease-in-out;
            background-color: #f8f9fa; /* Light background for a clean look */
        }
        .container-fluid {
            padding-left: 1rem;
            padding-right: 1rem;
        }
        .header-nav .nav-link {
            color: #1a73e8; /* Google Blue for links */
            text-decoration: none;
            transition: color 0.2s ease-in-out;
        }
        .header-nav .nav-link:hover {
            color: #0056b3; /* Darker blue on hover */
            text-decoration: underline;
        }
        .advanced-search-title {
            color: #3c4043; /* Dark gray for title */
            border-bottom: 1px solid #dadce0;
        }
        .form-label {
            color: #3c4043; /* Dark gray for labels */
            font-weight: 500;
            font-size: 0.875rem; /* text-sm equivalent */
        }
        .form-control:focus {
            border-color: #4285f4; /* Google blue for focus */
            box-shadow: 0 0 0 0.1rem rgba(66, 133, 244, 0.25); /* Light blue shadow */
        }
        .btn-primary-google {
            background-color: #4285f4; /* Google Blue */
            border-color: #4285f4;
            color: white;
            font-weight: 500;
            padding: 0.5rem 1.25rem;
            border-radius: 0.25rem;
            box-shadow: 0 1px 1px rgba(0,0,0,.1);
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .btn-primary-google:hover {
            background-color: #357ae8; /* Darker Google Blue on hover */
            border-color: #357ae8;
            box-shadow: 0 1px 3px rgba(0,0,0,.2);
        }
        .input-group-label {
            flex: 0 0 auto; /* Prevent label from shrinking */
            width: 150px; /* Fixed width for labels, adjust as needed */
            text-align: right;
            padding-right: 1rem;
        }
        @media (max-width: 767px) {
            .input-group-label {
                width: auto; /* Auto width on small screens */
                text-align: left;
                padding-right: 0;
            }
        }
    </style>
</head>
<body class="bg-white text-gray-800">
    <!-- Header: Contains navigation link back to the main search page -->
    <header class="d-flex justify-content-end p-3 bg-light">
        <nav class="header-nav">
            <a href="index.html" class="nav-link">Google Search</a>
        </nav>
    </header>

    <!-- Main Content Area: Advanced Search title and form -->
    <main class="flex-grow-1 d-flex justify-content-center py-4">
        <div class="container-fluid" style="max-width: 800px;">
            <h1 class="h3 fw-normal text-secondary mb-4 mt-3 pb-3 advanced-search-title">Advanced Search</h1>

            <!-- Advanced Search Form -->
            <form action="https://www.google.com/search" method="GET" class="row g-3">
                <!-- Section for "Find pages with..." -->
                <div class="col-12">
                    <div class="row align-items-center">
                        <div class="col-md-5">
                            <label for="all-words" class="form-label mb-md-0">Find pages with... "all these words:"</label>
                        </div>
                        <div class="col-md-7">
                            <input type="text" id="all-words" name="as_q" class="form-control rounded" placeholder="e.g. cloud computing">
                        </div>
                    </div>
                </div>

                <div class="col-12">
                    <div class="row align-items-center">
                        <div class="col-md-5">
                            <label for="exact-phrase" class="form-label mb-md-0">Find pages with... "this exact word or phrase:"</label>
                        </div>
                        <div class="col-md-7">
                            <input type="text" id="exact-phrase" name="as_epq" class="form-control rounded" placeholder="e.g. 'artificial intelligence'">
                        </div>
                    </div>
                </div>

                <div class="col-12">
                    <div class="row align-items-center">
                        <div class="col-md-5">
                            <label for="any-words" class="form-label mb-md-0">Find pages with... "any of these words:"</label>
                        </div>
                        <div class="col-md-7">
                            <input type="text" id="any-words" name="as_oq" class="form-control rounded" placeholder="e.g. 'machine learning' OR 'deep learning'">
                        </div>
                    </div>
                </div>

                <div class="col-12">
                    <div class="row align-items-center">
                        <div class="col-md-5">
                            <label for="none-words" class="form-label mb-md-0">Find pages with... "none of these words:"</label>
                        </div>
                        <div class="col-md-7">
                            <input type="text" id="none-words" name="as_eq" class="form-control rounded" placeholder="e.g. 'neural network'">
                        </div>
                    </div>
                </div>

                <!-- Advanced Search Button -->
                <div class="col-12 d-flex justify-content-end pt-3">
                    <button type="submit" class="btn btn-primary-google">Advanced Search</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Optional Footer -->
    <footer class="p-3 text-center text-muted small mt-auto bg-light">
        &copy; 2025 Google Reimagined
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigF/h/6tC/vT/t6l5V" crossorigin="anonymous"></script>
</body>
</html>
