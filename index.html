<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Search</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- Google Fonts for Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: all 0.3s ease-in-out;
            background-color: #f8f9fa; /* Light background for a clean look */
        }
        .header-nav .nav-link {
            color: #1a73e8; /* Google Blue for links */
            text-decoration: none;
            transition: color 0.2s ease-in-out;
        }
        .header-nav .nav-link:hover {
            color: #0056b3; /* Darker blue on hover */
            text-decoration: underline;
        }
        .form-control-search {
            border-radius: 24px; /* More rounded corners for search bar */
            height: 48px; /* Taller search bar */
            padding-left: 20px;
            padding-right: 20px;
            font-size: 1.1rem;
            border: 1px solid #dadce0;
            box-shadow: none; /* Remove default Bootstrap shadow */
            transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .form-control-search:focus {
            border-color: transparent;
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
        }
        .btn-google-search {
            background-color: #f8f9fa; /* Light gray */
            border: 1px solid #f8f9fa;
            color: #3c4043; /* Dark gray text */
            font-weight: 500;
            padding: 8px 15px;
            border-radius: 4px;
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .btn-google-search:hover {
            background-color: #f0f0f0;
            border-color: #dadce0;
            box-shadow: 0 1px 1px rgba(0,0,0,.1);
        }
    </style>
</head>
<body class="bg-white text-gray-800">
    <!-- Header: Contains navigation links to other search pages -->
    <header class="d-flex justify-content-end p-3 bg-light">
        <nav class="header-nav">
            <a href="image_search.html" class="nav-link me-3">Image Search</a>
            <a href="advanced_search.html" class="nav-link">Advanced Search</a>
        </nav>
    </header>

    <!-- Main Content Area: Centered logo, search bar, and buttons -->
    <main class="flex-grow-1 d-flex flex-column justify-content-center align-items-center p-4">
        <!-- Google Logo -->
        <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google" class="mb-4 img-fluid" style="max-width: 272px; height: auto;">

        <!-- Search Form -->
        <form action="https://www.google.com/search" method="GET" class="d-flex flex-column align-items-center w-100" style="max-width: 580px;">
            <!-- Search Input Field -->
            <input type="text" name="q" class="form-control form-control-search mb-4" placeholder="Search Google or type a URL">

            <!-- Search Buttons -->
            <div class="d-flex flex-column flex-sm-row justify-content-center">
                <!-- Google Search Button -->
                <button type="submit" class="btn btn-google-search me-sm-3 mb-2 mb-sm-0">Google Search</button>
                <!-- I'm Feeling Lucky Button -->
                <button type="submit" name="btnI" value="1" class="btn btn-google-search">I'm Feeling Lucky</button>
            </div>
        </form>
    </main>

    <!-- Optional Footer -->
    <footer class="p-3 text-center text-muted small mt-auto bg-light">
        &copy; 2025 Google Reimagined
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigF/h/6tC/vT/t6l5V" crossorigin="anonymous"></script>
</body>
</html>
